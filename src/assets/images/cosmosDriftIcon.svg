<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c18" />
      <stop offset="100%" stop-color="#141126" />
    </linearGradient>

    <!-- Sun Radial Gradient -->
    <radialGradient id="sunGrad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Sun Halo / Corona Glow -->
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Planet Gradient -->
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>

    <!-- Thruster / Drift Tail Gradient -->
    <linearGradient id="driftTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85" />
    </linearGradient>

    <!-- Soft Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Dark App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#272346" stroke-width="1.5" />

  <!-- Subtle Minimalist Stars -->
  <circle cx="20" cy="24" r="1.1" fill="#ffffff" opacity="0.8" />
  <circle cx="82" cy="78" r="1.2" fill="#38bdf8" opacity="0.85" />
  <circle cx="84" cy="22" r="0.8" fill="#ffffff" opacity="0.5" />
  <circle cx="16" cy="76" r="0.8" fill="#ffffff" opacity="0.4" />
  <circle cx="50" cy="14" r="0.6" fill="#38bdf8" opacity="0.5" />

  <!-- 2D Orbit Ring (tilted cosmic ellipse) -->
  <ellipse cx="50" cy="50" rx="34" ry="14" transform="rotate(-25 50 50)" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.35" />

  <!-- Sun Outer Corona Glow -->
  <circle cx="50" cy="50" r="22" fill="url(#sunHalo)" />

  <!-- Sun Body -->
  <circle cx="50" cy="50" r="13" fill="url(#sunGrad)" filter="url(#glow)" />
  <!-- Sun Surface Highlight -->
  <circle cx="47" cy="47" r="4" fill="#ffffff" opacity="0.5" />

  <!-- 2D Drifting Planet on Orbit -->
  <!-- Drift Trail -->
  <path d="M 68,36 Q 74,38 78,41" fill="none" stroke="url(#driftTail)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Planet Body -->
  <circle cx="78" cy="41" r="4.8" fill="url(#planetGrad)" filter="url(#glow)" />
  <!-- Planet Crescent Highlight -->
  <circle cx="76.8" cy="39.8" r="1.6" fill="#ffffff" opacity="0.85" />
</svg>
