<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="100%" stop-color="#120c24" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0d6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="120" rx="14" fill="url(#bgGrad)" stroke="#2a1f4e" stroke-width="1.5" />

  <!-- Stars Background -->
  <circle cx="28" cy="24" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="85" cy="18" r="1" fill="#00e5ff" opacity="0.6" />
  <circle cx="295" cy="30" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="270" cy="95" r="1" fill="#863bff" opacity="0.7" />
  <circle cx="45" cy="100" r="1.2" fill="#ffffff" opacity="0.5" />
  <circle cx="180" cy="15" r="0.8" fill="#00e5ff" opacity="0.4" />

  <!-- Icon Emblem (Left) -->
  <g transform="translate(26, 26) scale(1.4)">
    <!-- Glowing background ring -->
    <ellipse cx="24" cy="23" rx="22" ry="9" stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.6" transform="rotate(-25 24 23)" filter="url(#subtleGlow)" />
    
    <!-- Central Shape -->
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" filter="url(#glow)" />
    <path fill="url(#accentGrad)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(112, 44)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="url(#textGrad)">
      COSMOS DRIFT
    </text>
    <text y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" letter-spacing="2.5" fill="#00e5ff" opacity="0.9">
      3D WEBGL SPACE ODYSSEY
    </text>
    <g transform="translate(0, 36)">
      <rect width="60" height="15" rx="3" fill="#863bff" fill-opacity="0.25" stroke="#863bff" stroke-width="0.8" />
      <text x="30" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#cbb4ff">
        Three.js
      </text>

      <rect x="68" width="50" height="15" rx="3" fill="#00e5ff" fill-opacity="0.18" stroke="#00e5ff" stroke-width="0.8" />
      <text x="93" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#9effff">
        R3F
      </text>

      <rect x="126" width="62" height="15" rx="3" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" />
      <text x="157" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#ffffff">
        Web Audio
      </text>
    </g>
  </g>
</svg>
